server:
  port: ${PORT:8080}

spring:
  application:
    name: user-identity

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:truckdar_db}
    username: ${DB_USER:truckdar_admin}
    password: ${DB_PASSWORD:truckdar_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: user-identity-hikari-pool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:truckdar_db}
    user: ${DB_USER:truckdar_admin}
    password: ${DB_PASSWORD:truckdar_password}

app:
  jwt:
    secret: ${JWT_SECRET:TruckDarSecretKeySecurityAuthenticationToken2026MasterKey!}
    secret-key: ${JWT_SECRET:TruckDarSecretKeySecurityAuthenticationToken2026MasterKey!}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}

security:
  jwt:
    secret-key: ${JWT_SECRET:TruckDarSecretKeySecurityAuthenticationToken2026MasterKey!}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-token-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha