# ═══════════════════════════════════════════════════════════════════
# TruckDar — User Identity Microservice
# Configuración base (se sobreescribe por perfil: local, dev, prod)
# ═══════════════════════════════════════════════════════════════════

spring:
  application:
    name: user-identity

  # ── Base de datos ──
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/truckdar_identity}
    username: ${DB_USERNAME:truckdar}
    password: ${DB_PASSWORD:truckdar}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration

# ── JWT ──
app:
  jwt:
    secret: ${JWT_SECRET:dHJ1Y2tkYXItdXNlci1pZGVudGl0eS1zZWNyZXQta2V5LWJhc2U2NC1lbmNvZGVkLWF0LWxlYXN0LTI1Ni1iaXRz}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# ── OpenAPI ──
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Servidor ──
server:
  port: ${SERVER_PORT:8080}
