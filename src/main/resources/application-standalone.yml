# ═══════════════════════════════════════════════════════════════════
# Perfil: standalone (prueba rápida local con H2 en memoria)
# No requiere Docker ni PostgreSQL instalado previamente
# ═══════════════════════════════════════════════════════════════════

spring:
  datasource:
    url: jdbc:h2:mem:truckdar_identity;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    escuelaing.edu.co.truckdar: DEBUG
    org.springframework.security: DEBUG
